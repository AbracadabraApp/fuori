<meta charset="utf-8">
<title>Beginner Levels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* The person screen at each beginner level (docs/beginner-scaffolding.md). Static mockup, light-only as the app is. */
:root{--paper:#f5f1ed;--olive:#566330;--olive-dark:#3f4a22;--ink:#000;--text:#333;--muted:#666;--sand:#e8d5c4;--terracotta:#c0603a;--serif:'Alegreya',Georgia,serif;--sans:'Alegreya Sans','Gill Sans',sans-serif;color-scheme:light}
body{margin:0;background:#e9e3dc;font-family:var(--sans);color:var(--text);padding:24px 16px}
h1{font-family:var(--serif);font-size:28px;margin:0 0 4px}
.lede{margin:0 0 20px;color:var(--muted);font-size:16px;max-width:760px}
.row{display:flex;flex-wrap:wrap;gap:28px}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figcaption{font-size:15px;font-weight:700;color:var(--ink);max-width:390px}
.phone{position:relative;width:390px;height:844px;border-radius:36px;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.nav{flex:none;height:98px;box-sizing:border-box;padding:52px 8px 2px 4px;display:flex;align-items:center;justify-content:space-between}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--olive);font:17px var(--sans);min-height:44px}
.gear{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.band{flex:none;padding:6px 16px 12px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid rgba(0,0,0,.12);position:relative;z-index:1;background:var(--paper)}
.band .name{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1.1;color:var(--ink)}
.band .role{font-size:19px;color:var(--muted)}
.pic{flex:1;position:relative;overflow:hidden;background:var(--sand)}
.pic img{position:absolute;top:0;left:-47px;width:484px;height:726px;object-fit:cover;object-position:center top}
.bottom{position:absolute;left:16px;right:16px;bottom:30px;display:flex;flex-direction:column;gap:8px}
.subs{background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.subs .it{font:italic 18px/1.4 -apple-system,system-ui,sans-serif;color:var(--text)}
.subs .en{font:16px/1.3 -apple-system,system-ui,sans-serif;color:var(--muted)}
.reply{min-height:58px;padding:7px 14px;border-radius:14px;border:1px solid rgba(86,99,48,.4);background:linear-gradient(180deg,rgba(236,240,220,.9),rgba(214,223,188,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;gap:1px}
.reply .a{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink)}
.reply .b{font-size:14px;color:var(--olive-dark)}
.card{background:rgba(245,241,237,.96);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card .ins{font-size:15px;font-weight:700;color:var(--olive-dark)}
.card .line{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink)}
mark{background:var(--sand);color:#000;padding:0 3px;border-radius:4px}
.slot{display:inline-block;width:170px;border-bottom:2px solid var(--terracotta)}
.controls{display:flex;align-items:center;justify-content:space-between;padding-bottom:4px}
.controls.tap{justify-content:center}
.pill{width:112px;height:52px;border-radius:26px;border:2px solid rgba(86,99,48,.35);background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.glass{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:var(--text)}
.less{min-height:44px;padding:0 18px 0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;color:var(--olive-dark);font:700 17px var(--sans);}
.spacer{width:44px;height:44px}
</style>
<h1>Beginner levels on the person screen</h1>
<p class="lede">Giulia's screen at each level of <code>docs/beginner-scaffolding.md</code>, with the same exchange throughout so only the support changes. Default tap-to-talk mode: one control per level (the replies or the mic); no Replay; Pause appears only in hands-free.</p>
<div class="row" id="row"></div>
<script>
const IMG='../../public/images/portraits/giulia.jpg';
const MIC='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const STEPS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h5v-5h5V9h5V4"/><path d="M15 4h4v4"/></svg>';
const LEVELS=[
 {cap:'Level 1: choose, all English',subEn:true,replies:'en'},
 {cap:'Level 2: choose, English on Giulia',subEn:true,replies:'it'},
 {cap:'Level 3: choose, Italian only',subEn:false,replies:'it'},
 {cap:'Level 4: read out loud',subEn:false,card:'read'},
 {cap:'Level 5: fill the frame',subEn:false,card:'frame'},
 {cap:'Past level 5: the normal screen',subEn:false},
 {cap:'Level 2 after being asked: Less help',subEn:true,replies:'it',less:true}
];
function reply(it,en,showEn){return '<div class="reply"><span class="a" lang="it">'+it+'</span>'+(showEn?'<span class="b">'+en+'</span>':'')+'</div>'}
function phone(l){
 let b='<div class="subs"><span class="it" lang="it">Buongiorno! Cosa prendi?</span>'+(l.subEn?'<span class="en">Good morning! What are you having?</span>':'')+'</div>';
 if(l.replies){const e=l.replies==='en';b+=reply('Vorrei un cornetto integrale.','I’d like a wholemeal croissant.',e)+reply('Vorrei un macchiato.','I’d like a macchiato.',e);
  if(l.less)b+='<div class="controls tap"><span class="less">'+STEPS+'Less help</span></div>';}
 else{
  if(l.card==='read')b+='<div class="card"><span class="ins">Read your line out loud</span><span class="line" lang="it"><mark>Vorrei</mark> un cornetto integrale.</span></div>';
  if(l.card==='frame')b+='<div class="card"><span class="ins">Answer Giulia out loud, your way:</span><span class="line" lang="it"><mark>Vorrei</mark> <span class="slot">&#8203;</span></span></div>';
  b+='<div class="controls" style="justify-content:center"><span class="pill" aria-label="Tap to speak">'+MIC+'</span></div>';}
 return '<figure><figcaption>'+l.cap+'</figcaption><div class="phone"><div class="nav"><span class="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Trastevere</span><span class="gear" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#566330" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg></span></div><div class="band"><span class="name">Giulia</span><span class="role">Barista, Trastevere</span></div><div class="pic"><img src="'+IMG+'" alt="Giulia"><div class="bottom">'+b+'</div></div></div></figure>';
}
document.getElementById('row').innerHTML=LEVELS.map(phone).join('');
</script>
