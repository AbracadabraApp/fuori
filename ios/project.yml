# The Xcode project is generated from this file: run `make project` (XcodeGen).
# Fuori.xcodeproj is git-ignored; never edit it by hand (docs/12-native-app.md).
name: Fuori
options:
  bundleIdPrefix: com.joshp100
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  FuoriKit:
    path: FuoriKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: C8V9S6KGGG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    # Each country's server (Info.plist FuoriCountryServers), in the order the
    # country choice shows them; the learner picks one on first launch and can
    # switch in Settings (docs/12-native-app.md decision 1)
    FUORI_SERVER_IT: https://fuori-production.up.railway.app
    FUORI_SERVER_MX: https://afuera-production.up.railway.app
targets:
  Fuori:
    type: application
    platform: iOS
    sources:
      - path: Fuori
    dependencies:
      - package: FuoriKit
        product: FuoriFeatures
      - package: FuoriKit
        product: FuoriNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshp100.fuori
        # The app icon (Resources/Assets.xcassets; picked by Josh 2026-10-17, design/app-icon/README.md)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Fuori/Info.plist
      properties:
        CFBundleDisplayName: Fuori
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FuoriCountryServers:
          - $(FUORI_SERVER_IT)
          - $(FUORI_SERVER_MX)
        # The system launch screen: paper and the launch picture, matched exactly by
        # the app's first view (LaunchView), so there's no white flash (iOS conventions A13)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchArt
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Light only until the "night paper" palette exists (docs/13-ios-conventions.md A1, D1):
        # otherwise system bars turn white on the light paper in Dark Mode
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - Alegreya.ttf
          - AlegreyaSans-Regular.ttf
          - AlegreyaSans-Italic.ttf
          - AlegreyaSans-Medium.ttf
          - AlegreyaSans-Bold.ttf
        # Shown with the first microphone request (docs/13-ios-conventions.md → Privacy)
        NSMicrophoneUsageDescription: "Fuori listens while it's your turn, so the person you're talking with can hear and answer you. What you say is sent to Fuori's server and AI services to understand it."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  Fuori:
    build:
      targets:
        Fuori: all
    test:
      targets:
        - package: FuoriKit/FuoriCoreTests
        - package: FuoriKit/FuoriNetworkingTests
